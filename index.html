<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Essence Perfume</title>

<style>

/* ================= BACKGROUND ================= */
body{
    margin:0;
    font-family:'Georgia', serif;
    background:url("https://img.freepik.com/free-photo/gold-background-texture-gradients-shadow-ai-generative_1258-209615.jpg");
    background-size:cover;
    overflow-x:hidden;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* ================= ROSE PETALS FALL ================= */
.petal{
    position:fixed;
    top:-10%;
    width:45px;
    opacity:0.8;
    animation:fall 8s linear infinite;
}

.petal:nth-child(1){left:5%; animation-delay:0s;}
.petal:nth-child(2){left:20%; animation-delay:2s;}
.petal:nth-child(3){left:40%; animation-delay:1s;}
.petal:nth-child(4){left:60%; animation-delay:3s;}
.petal:nth-child(5){left:80%; animation-delay:4s;}

@keyframes fall{
    0%{transform:translateY(0);}
    100%{transform:translateY(120vh);}
}

/* ================= HERO ================= */
.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:70px;
    min-height:90vh;
}

/* LEFT SCENE */
.left{
    flex:1;
    position:relative;
}

/* PERFUME (BIG + CUTOUT FEEL) */
.perfume{
    width:500px;
    transform:scale(1.1);
    filter:drop-shadow(0 0 60px rgba(139,0,0,0.8));
}

/* ROSES */
.rose{
    position:absolute;
    top:20px;
    right:60px;
    width:90px;
}

.blackrose{
    position:absolute;
    bottom:40px;
    right:140px;
    width:80px;
}

/* CHERRY */
.cherry{
    position:absolute;
    top:160px;
    left:40px;
    width:70px;
}

/* TEXT */
.right{
    flex:1;
    padding-left:40px;
}

.right h1{
    font-size:65px;
    color:#d4af37;
    font-style:italic;
}

.right p{
    color:#ddd;
    font-size:18px;
}

/* ================= PRODUCTS ================= */
header{
    text-align:center;
    font-size:28px;
    color:#d4af37;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(212,175,55,0.4);
    border-radius:12px;
    text-align:center;
    padding:12px;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

h3{color:#d4af37;}

.desc{color:#ccc;font-size:14px;}

.btn{
    display:inline-block;
    margin-top:10px;
    padding:10px;
    background:linear-gradient(90deg,#8b0000,#d4af37);
    color:white;
    text-decoration:none;
    border-radius:6px;
}

</style>
</head>

<body>

<!-- ROSE PETALS -->

<div class="petal"><img src="https://png.pngtree.com/png-vector/20250205/ourmid/pngtree-red-rose-petals-aesthetic-romantic-border-png-image_15387976.png" width="45"></div>

<!-- HERO -->
