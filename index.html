<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfume Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0b0b0b;
      color: white;
    }

    header {
      background: #8b0000;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      justify-content: center;
      background: black;
      padding: 10px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ff4d4d;
    }

    .container {
      padding: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 10px rgba(255,0,0,0.3);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #8b0000;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .btn:hover {
      background: #ff0000;
    }

    .add-section {
      margin-top: 30px;
      background: #111;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 10px;
      background: #8b0000;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>Luxury Perfume Store</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Shop</a>
  <a href="#">Contact</a>
</nav>

<div class="container">
  <h2>Our Perfumes</h2>

  <div class="product-grid" id="productGrid">
    <!-- Products will appear here -->
  </div>

  <div class="add-section">
    <h3>Add New Perfume</h3>
    <input type="text" id="name" placeholder="Perfume Name">
    <input type="text" id="image" placeholder="Image URL">
    <input type="text" id="link" placeholder="Buy Link">
    <button onclick="addProduct()">Add Product</button>
  </div>
</div>

<script>
  function addProduct() {
    const name = document.getElementById('name').value;
    const image = document.getElementById('image').value;
    const link = document.getElementById('link').value;

    if (!name || !image || !link) {
      alert('Please fill all fields');
      return;
    }

    const grid = document.getElementById('productGrid');

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <img src="${image}" alt="${name}">
      <h4>${name}</h4>
      <a href="${link}" target="_blank" class="btn">Buy Now</a>
    `;

    grid.appendChild(card);

    document.getElementById('name').value = '';
    document.getElementById('image').value = '';
    document.getElementById('link').value = '';
  }
</script>

</body>
</html>
