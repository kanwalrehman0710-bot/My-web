<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Perfume Store</title>

<style>

body{
    margin:0;
    font-family:'Georgia', serif;
    background:url("https://img.freepik.com/free-photo/gold-background-texture-gradients-shadow-ai-generative_1258-209615.jpg");
    background-size:cover;
    color:white;
}

/* dark overlay */
body::before{
    content:"";
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* ================= ROSE PETALS (STATIC FALL LOOK) ================= */
.petal{
    position:fixed;
    top:-10%;
    width:50px;
    opacity:0.7;
}

.petal:nth-child(1){left:10%;}
.petal:nth-child(2){left:30%;}
.petal:nth-child(3){left:50%;}
.petal:nth-child(4){left:70%;}
.petal:nth-child(5){left:90%;}

/* ================= HERO ================= */
.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:70px;
    min-height:90vh;
}

/* LEFT */
.left{
    flex:1;
    position:relative;
}

/* PERFUME (NO ANIMATION) */
.perfume{
    width:420px;
    filter:drop-shadow(0 0 40px rgba(139,0,0,0.6));
}

/* ROSES */
.rose{
    position:absolute;
    top:40px;
    right:40px;
    width:90px;
}

.blackrose{
    position:absolute;
    bottom:60px;
    right:120px;
    width:80px;
}

.cherry{
    position:absolute;
    top:140px;
    left:40px;
    width:70px;
}

/* TEXT */
.right{
    flex:1;
    padding-left:40px;
}

.right h1{
    font-size:60px;
    color:#d4af37;
    font-style:italic;
}

.right p{
    color:#ddd;
}

/* PRODUCTS */
header{
    text-align:center;
    font-size:28px;
    color:#d4af37;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(212,175,55,0.4);
    padding:12px;
    border-radius:12px;
    text-align:center;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

h3{color:#d4af37;}

.desc{color:#ccc;font-size:14px;}

.btn{
    display:inline-block;
    margin-top:10px;
    padding:10px;
    background:linear-gradient(90deg,#8b0000,#d4af37);
    color:white;
    text-decoration:none;
    border-radius:6px;
}

</style>
</head>

<body>

<!-- ROSE PETALS (FIXED BACK) -->
<div class="petal"><img src="https://png.pngtree.com/png-vector/20250205/ourmid/pngtree-red-rose-petals-aesthetic-romantic-border-png-image_15387976.png" width="50"></div>
<div class="petal"><img src="https://png.pngtree.com/png-vector/20250205/ourmid/pngtree-red-rose-petals-aesthetic-romantic-border-png-image_15387976.png" width="50"></div>
<div class="petal"><img src="https://png.pngtree.com/png-vector/20250205/ourmid/pngtree-red-rose-petals-aesthetic-romantic-border-png-image_15387976.png" width="50"></div>
<div class="petal"><img src="https://png.pngtree.com/png-vector/20250205/ourmid/pngtree-red-rose-petals-aesthetic-romantic-border-png-image_15387976.png" width="50"></div>
<div class="petal"><img src="https://png.pngtree.com/png-vector/20250205/ourmid/pngtree-red-rose-petals-aesthetic-romantic-border-png-image_15387976.png" width="50"></div>

<!-- HERO -->
<section class="hero">

<div class="left">

    <img class="perfume" src="https://raw.githubusercontent.com/kanwalrehman0710-bot/My-web/refs/heads/main/Gemini_Generated_Image_kse69kkse69kkse6.png">

    <!-- DECOR -->
    <img class="rose" src="https://cdn-icons-png.flaticon.com/512/2909/2909763.png">
    <img class="blackrose" src="https://cdn-icons-png.flaticon.com/512/616/616408.png">
    <img class="cherry" src="https://cdn-icons-png.flaticon.com/512/590/590685.png">

</div>

<div class="right">
<h1>Royal Essence</h1>
<p>Luxury perfume collection with elegant royal fragrance identity.</p>

</html>
