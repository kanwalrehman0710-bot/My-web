<style>

body{
    margin:0;
    font-family:Georgia, serif;
    background:url("https://img.freepik.com/free-photo/gold-background-texture-gradients-shadow-ai-generative_1258-209615.jpg");
    background-size:cover;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* PETALS */
.petal{
    position:fixed;
    top:-10%;
    width:40px;
    animation:fall 8s linear infinite;
}
.p1{left:10%; animation-delay:0s;}
.p2{left:30%; animation-delay:2s;}
.p3{left:50%; animation-delay:1s;}
.p4{left:70%; animation-delay:3s;}
.p5{left:90%; animation-delay:4s;}

@keyframes fall{
    from{transform:translateY(0);}
    to{transform:translateY(120vh);}
}

/* HERO */
.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:60px;
    min-height:90vh;
}

.left{
    flex:1;
    position:relative;
}

/* PERFUME */
.perfume{
    width:520px;
    filter:drop-shadow(0 0 60px rgba(139,0,0,0.8));
    transform:scale(1.05);
}

/* DECOR */
.rose{
    position:absolute;
    top:40px;
    right:60px;
    width:80px;
}

.cherry{
    position:absolute;
    top:160px;
    left:40px;
    width:70px;
}

/* TEXT */
.right{
    flex:1;
    padding-left:40px;
}

.right h1{
    font-size:65px;
    color:#d4af37;
    font-style:italic;
}

/* HEADER */
header{
    text-align:center;
    font-size:28px;
    color:#d4af37;
    padding:20px;
}

/* PRODUCTS */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(212,175,55,0.4);
    border-radius:12px;
    padding:12px;
    text-align:center;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.btn{
    display:inline-block;
    margin-top:10px;
    padding:10px;
    background:linear-gradient(90deg,#8b0000,#d4af37);
    color:white;
    text-decoration:none;
    border-radius:6px;
}

</style>
</head>
