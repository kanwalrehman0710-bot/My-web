<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Perfume Store</title>

<style>

/* ================= LOADER ================= */
#loader{
    position:fixed;
    width:100%;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    color:#d4af37;
    font-size:22px;
    letter-spacing:4px;
}

/* ================= BASE ================= */
body{
    margin:0;
    font-family:'Georgia', serif;
    background:black;
    color:white;
    overflow-x:hidden;
}

/* ================= PETALS ================= */
.petal{
    position:fixed;
    top:-10%;
    width:18px;
    height:28px;
    background:radial-gradient(circle at 30% 30%, #ff4d6d, #8b0000);
    border-radius:60%;
    animation:fall 7s linear infinite;
}

.petal:nth-child(1){left:10%;}
.petal:nth-child(2){left:25%; animation-delay:2s;}
.petal:nth-child(3){left:45%; animation-delay:1s;}
.petal:nth-child(4){left:70%; animation-delay:3s;}
.petal:nth-child(5){left:85%; animation-delay:4s;}

@keyframes fall{
    0%{transform:translateY(0);}
    100%{transform:translateY(110vh);}
}

/* ================= BRAND ================= */
.brand{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:#d4af37;
    font-size:26px;
    letter-spacing:5px;
}

/* ================= HERO ================= */
.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:60px;
    min-height:90vh;
}

.hero-left h1{
    font-size:60px;
    color:#d4af37;
    font-style:italic;
}

.perfume{
    width:260px;
    animation:float 3s infinite;
    box-shadow:0 0 50px rgba(212,175,55,0.5);
    border-radius:20px;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
    100%{transform:translateY(0);}
}

/* ================= CART ================= */
#cart{
    position:fixed;
    right:20px;
    top:20px;
    padding:10px 15px;
    border:1px solid #d4af37;
    background:rgba(212,175,55,0.2);
}

/* ================= PRODUCTS ================= */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(212,175,55,0.4);
    text-align:center;
    padding:10px;
    border-radius:12px;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:10px;
}

.btn{
    margin:5px;
    padding:8px 10px;
    background:linear-gradient(90deg,#8b0000,#d4af37);
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* ================= POPUP ================= */
#popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:black;
    border:1px solid #d4af37;
    padding:20px;
    width:300px;
    display:none;
    z-index:10000;
    text-align:center;
}

#popup img{
    width:100%;
    border-radius:10px;
}

.close{
    margin-top:10px;
    display:inline-block;
    cursor:pointer;
    color:#ff4d6d;
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">LUXURY PERFUME HOUSE</div>

<!-- PETALS -->
<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>

<!-- CART -->
<div id="cart">🛒 Cart: <span id="count">0</span></div>

<!-- BRAND -->
<div class="brand">LUXURY PERFUME STORE</div>

<!-- HERO -->
<section class="hero">

<div class="hero-left">
<h1>Golden Essence</h1>
<p>Luxury fragrances crafted for elegance and power.</p>
</div>

<img class="perfume" src="https://plus.unsplash.com/premium_photo-1763213094860-0a0428bc1e6a">

</section>

<!-- PRODUCTS -->
<div class="container">

<div class="card">
<img src="https://plus.unsplash.com/premium_photo-1763213094860-0a0428bc1e6a">
<h3>Red Luxury</h3>
<button class="btn" onclick="showProduct('Red Luxury','Strong royal fragrance with long lasting effect','https://plus.unsplash.com/premium_photo-1763213094860-0a0428bc1e6a')">Details</button>
</div>

<div class="card">
<img src="https://media.istockphoto.com/id/656612166/photo/bottle.jpg">
<h3>Black Premium</h3>
<button class="btn" onclick="showProduct('Black Premium','Dark luxury scent for night use','https://media.istockphoto.com/id/656612166/photo/bottle.jpg')">Details</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1608528577891-eb055944f2e7">
<h3>Midnight Elegance</h3>
<button class="btn" onclick="showProduct('Midnight Elegance','Soft elegant feminine fragrance','https://images.unsplash.com/photo-1608528577891-eb055944f2e7')">Details</button>
</div>

</div>

<!-- POPUP -->
<div id="popup">
<h3 id="pname"></h3>
<img id="pimg">
<p id="pdesc"></p>
<span class="close" onclick="closePopup()">Close</span>
</div>

<script>

/* LOADER */
window.onload=function(){
 setTimeout(()=>document.getElementById("loader").style.display="none",2000);
}

/* CART */
let count=0;
function addCart(){
 count++;
 document.getElementById("count").innerText=count;
}

/* PRODUCT POPUP */
function showProduct(name,desc,img){
 document.getElementById("popup").style.display="block";
 document.getElementById("pname").innerText=name;
 document.getElementById("pdesc").innerText=desc;
 document.getElementById("pimg").src=img;
}

function closePopup(){
 document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
